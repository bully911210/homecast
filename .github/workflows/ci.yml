name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install Google Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - run: npm run e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: test-results
          retention-days: 7

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCast-win-x64
          path: dist/HomeCast-win-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(sha256sum dist/HomeCast-win-x64.zip | cut -d' ' -f1)
          {
            echo "## Download"
            echo
            echo "**[HomeCast-win-x64.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/HomeCast-win-x64.zip)**: unzip, run \`homecast.exe\`, follow \`README-FIRST.txt\`."
            echo
            echo "SHA-256: \`$SHA\`"
            echo
            echo "The exe is not code-signed yet, so SmartScreen asks once (More info, then Run anyway). Check the hash above if you want to be sure the file is the one CI built from this tag."
            echo
            echo "Bundled ffmpeg and ffprobe are GPL; see THIRD-PARTY.txt in the zip for licences and source links."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/HomeCast-win-x64.zip --title "HomeCast $GITHUB_REF_NAME" --notes-file notes.md --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/HomeCast-win-x64.zip --clobber
