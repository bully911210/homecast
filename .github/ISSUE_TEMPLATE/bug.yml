name: Bug
description: Something broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: health
    attributes:
      label: Health section
      description: Paste the Health section from the admin page (http://localhost:8096/admin). It contains no file names.
  - type: input
    id: version
    attributes:
      label: HomeCast version
      placeholder: v0.1.0
