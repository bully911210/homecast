<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HomeCast social preview</title>
<style>
  /* 1280x640 GitHub social preview. Rendered by tools/social.ts. */
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #0e1116; color: #f2f4f8;
    font-family: "Segoe UI", system-ui, sans-serif; }
  .wrap { position: relative; width: 100%; height: 100%; }
  .shot { position: absolute; right: -40px; top: 70px; width: 720px; border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
    border: 6px solid #1a1f29; transform: rotate(-2deg); }
  .text { position: absolute; left: 72px; top: 80px; width: 520px; }
  .mark { width: 96px; height: 96px; margin-bottom: 18px; }
  h1 { font-size: 96px; margin: 0 0 18px; letter-spacing: -2px; }
  h1 span { color: #ffb020; }
  p { font-size: 34px; line-height: 1.3; margin: 0 0 34px; color: #c9d1dc; }
  .chips span { display: inline-block; font-size: 22px; padding: 10px 18px; margin: 0 10px 12px 0; border-radius: 999px;
    background: #1a1f29; color: #f2f4f8; border: 1px solid #2a3242; }
</style>
</head>
<body>
<div class="wrap">
  <img class="shot" src="../docs/media/home.jpg" alt="">
  <div class="text">
    <img class="mark" src="../docs/brand/icon.svg" alt="">
    <h1>Home<span>Cast</span></h1>
    <p>Your PC's movies on your TV's browser. One exe, no account.</p>
    <div class="chips"><span>12 KB TV app</span><span>6 deps</span><span>GPU transcode</span><span>MIT</span></div>
  </div>
</div>
</body>
</html>
